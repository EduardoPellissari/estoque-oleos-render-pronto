services:
  - type: web
    name: estoque-doterra
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: estoque-doterra-db
          property: connectionString

databases:
  - name: estoque-doterra-db
    plan: free
    databaseName: estoque_doterra
    user: estoque_doterra
